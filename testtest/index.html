<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wetter App</title>
<style>
  :root { --bg:#eaf3fb; --card:#fff; --text:#1c2b39; --muted:#6b7c8c; --accent:#2f80ed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#10192a; --card:#1a2638; --text:#e8eef6; --muted:#8fa1b5; --accent:#5aa2ff; }
  }
  :root[data-theme="dark"] { --bg:#10192a; --card:#1a2638; --text:#e8eef6; --muted:#8fa1b5; --accent:#5aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:480px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; padding:12px; font-size:16px; border:1px solid var(--muted); border-radius:10px; background:var(--card); color:var(--text); }
  button { padding:12px 16px; font-size:16px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .now { text-align:center; }
  .now .icon { font-size:64px; }
  .now .temp { font-size:56px; font-weight:700; }
  .muted { color:var(--muted); }
  .details { display:flex; justify-content:space-around; margin-top:12px; }
  .days { display:grid; gap:8px; }
  .day { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .day span:last-child { text-align:right; }
  #msg { text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <form id="form">
    <input id="city" placeholder="Stadt eingeben…" value="Berlin" autocomplete="off">
    <button>Suchen</button>
  </form>
  <p id="msg"></p>
  <section id="out" hidden>
    <div class="card now">
      <div class="muted" id="place"></div>
      <div class="icon" id="icon"></div>
      <div class="temp" id="temp"></div>
      <div id="desc"></div>
      <div class="details muted">
        <span id="wind"></span><span id="hum"></span>
      </div>
    </div>
    <div class="card"><div class="days" id="days"></div></div>
  </section>
</main>
<script>
const CODES = {
  0:["☀️","Klar"],1:["🌤️","Überwiegend klar"],2:["⛅","Teils bewölkt"],3:["☁️","Bedeckt"],
  45:["🌫️","Nebel"],48:["🌫️","Reifnebel"],51:["🌦️","Leichter Nieselregen"],53:["🌦️","Nieselregen"],55:["🌧️","Starker Nieselregen"],
  61:["🌧️","Leichter Regen"],63:["🌧️","Regen"],65:["🌧️","Starker Regen"],71:["🌨️","Leichter Schnee"],73:["🌨️","Schnee"],75:["❄️","Starker Schnee"],
  80:["🌦️","Schauer"],81:["🌧️","Starke Schauer"],82:["⛈️","Heftige Schauer"],95:["⛈️","Gewitter"],96:["⛈️","Gewitter mit Hagel"],99:["⛈️","Starkes Gewitter"]
};
const $ = id => document.getElementById(id);
const info = c => CODES[c] || ["❔","Unbekannt"];

async function load(city) {
  $("msg").textContent = "Lade…"; $("out").hidden = true;
  try {
    const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=de`)).json();
    if (!g.results) throw new Error("Ort nicht gefunden");
    const { latitude, longitude, name, country } = g.results[0];
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`)).json();
    const [icon, desc] = info(w.current.weather_code);
    $("place").textContent = `${name}, ${country}`;
    $("icon").textContent = icon;
    $("temp").textContent = `${Math.round(w.current.temperature_2m)}°C`;
    $("desc").textContent = desc;
    $("wind").textContent = `💨 ${Math.round(w.current.wind_speed_10m)} km/h`;
    $("hum").textContent = `💧 ${w.current.relative_humidity_2m} %`;
    $("days").innerHTML = w.daily.time.map((t,i) => {
      const day = new Date(t).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric"});
      return `<div class="day"><span>${day}</span><span>${info(w.daily.weather_code[i])[0]}</span><span>${Math.round(w.daily.temperature_2m_max[i])}° / <span class="muted">${Math.round(w.daily.temperature_2m_min[i])}°</span></span></div>`;
    }).join("");
    $("msg").textContent = ""; $("out").hidden = false;
  } catch (e) { $("msg").textContent = e.message || "Fehler beim Laden"; }
}
$("form").addEventListener("submit", e => { e.preventDefault(); load($("city").value.trim()); });
load($("city").value);
</script>
</body>
</html>
